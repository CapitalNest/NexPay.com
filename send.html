<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
<title>NexPay — Send Crypto Assets</title>
<meta name="theme-color" content="#ffffff" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-hover: #f8fafc;
    --border: #f1f5f9;
    --border-dark: #e2e8f0;
    --pri: #0052ff;
    --pri-hover: #0045d8;
    --text: #0a0b0d;
    --text-dim: #5f6673;
    --danger: #cf304a;
    --danger-bg: rgba(207, 48, 74, 0.08);
  }

  * { 
    box-sizing: border-box; 
    font-family: 'Inter', sans-serif; 
    -webkit-tap-highlight-color: transparent; 
    margin: 0;
    padding: 0;
  }
  
  html, body { 
    height: 100%; 
    background-color: var(--bg); 
    color: var(--text); 
  }

  .shell { 
    min-height: 100%; 
    display: flex; 
    flex-direction: column; 
  }

  header {
    display: flex; 
    align-items: center; 
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background-color: var(--surface);
    position: sticky; 
    top: 0; 
    z-index: 1000;
  }

  .back-link {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
  }

  .header-title {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.3px;
  }

  .main-container {
    max-width: 520px;
    margin: 0 auto;
    width: 100%;
    padding: 28px 20px;
    flex-grow: 1;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dim);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .asset-selector {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .asset-card {
    border: 1px solid var(--border-dark);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    background: var(--surface);
    transition: all 0.15s ease;
  }

  .asset-card:hover {
    background: var(--surface-hover);
  }

  .asset-card.active {
    border-color: var(--pri);
    background: rgba(0, 82, 255, 0.04);
  }

  .asset-icon {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 14px;
  }

  .asset-symbol {
    font-size: 14px;
    font-weight: 700;
  }

  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .form-input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--border-dark);
    font-size: 15px;
    font-weight: 600;
    outline: none;
    color: var(--text);
    background: var(--surface);
    transition: border-color 0.15s ease;
  }

  .form-input:focus {
    border-color: var(--pri);
  }

  .form-input.error {
    border-color: var(--danger);
  }

  .input-suffix {
    position: absolute;
    right: 16px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dim);
    pointer-events: none;
  }

  .error-message {
    color: var(--danger);
    font-size: 12px;
    font-weight: 600;
    margin-top: 6px;
    display: none;
  }

  .calc-box {
    background: var(--surface-hover);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    margin-top: 8px;
    display: flex;
    justify-content: space-between;
    font-size: 13px;
  }

  .calc-label {
    color: var(--text-dim);
    font-weight: 500;
  }

  .calc-value {
    color: var(--text);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .toggle-mode-btn {
    background: none;
    border: none;
    color: var(--pri);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: inline-block;
    text-decoration: none;
  }

  .btn-submit {
    width: 100%;
    background: var(--pri);
    color: #ffffff;
    border: none;
    padding: 16px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 24px;
    transition: background-color 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-submit:hover {
    background: var(--pri-hover);
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <a href="./dashboard.html" class="back-link">← Back</a>
    <span class="header-title">Send On-Chain</span>
    <div style="width: 48px;"></div>
  </header>

  <main class="main-container">
    <!-- STEP 1: ASSET SELECTION -->
    <div class="form-group">
      <span class="form-label">Select Asset</span>
      <div class="asset-selector">
        <div class="asset-card active" id="btn-asset-btc" onclick="selectAsset('BTC')">
          <div class="asset-icon" style="color: #f7931a; background: rgba(247,147,26,0.1);">₿</div>
          <span class="asset-symbol">BTC</span>
        </div>
        <div class="asset-card" id="btn-asset-eth" onclick="selectAsset('ETH')">
          <div class="asset-icon" style="color: #627eea; background: rgba(98,126,234,0.1);">Ξ</div>
          <span class="asset-symbol">ETH</span>
        </div>
        <div class="asset-card" id="btn-asset-usdt" onclick="selectAsset('USDT')">
          <div class="asset-icon" style="color: #26a17b; background: rgba(38,161,123,0.1);">₮</div>
          <span class="asset-symbol">USDT</span>
        </div>
      </div>
    </div>

    <!-- RECIPIENT INPUT -->
    <div class="form-group">
      <div class="form-label">
        <span id="recipient-label">Recipient BTC Address</span>
        <button class="toggle-mode-btn" id="toggle-mode-btn" onclick="toggleTransferMode()">Send via UID</button>
      </div>
      <div class="input-wrapper">
        <input type="text" class="form-input" id="recipient-input" placeholder="Enter Bitcoin (BTC) address..." oninput="handleRecipientInput(this)" />
      </div>
    </div>

    <!-- NETWORK TYPE -->
    <div class="form-group">
      <span class="form-label">Network Type</span>
      <div class="input-wrapper">
        <input type="text" class="form-input" id="network-input" value="Bitcoin Network (BTC)" readonly style="background: var(--surface-hover); color: var(--text-dim);" />
      </div>
    </div>

    <!-- AMOUNT IN JPY -->
    <div class="form-group">
      <div class="form-label">
        <span>Amount (USDT)</span>
        <span style="font-weight: 500; text-transform: none;">Available: $0.00</span>
      </div>
      <div class="input-wrapper">
        <input type="number" class="form-input" id="jpy-amount" placeholder="0.00" min="0" step="0.01" oninput="handleAmountInput()" />
        <span class="input-suffix"></span>
      </div>
      <div class="error-message" id="amount-error-msg">Transfer amount exceeds available portfolio balance ($0.00).</div>
      
      <div class="calc-box">
        <span class="calc-label">Recipient Gets Approx:</span>
        <span class="calc-value" id="calc-btc-result">0.000000 BTC</span>
      </div>
    </div>

    <button class="btn-submit" id="btn-submit" onclick="handlePreview()">Preview Transfer</button>
  </main>
</div>

<script>
  let selectedAsset = 'BTC';
  let isUidMode = false;

  const assetNetworks = {
    'BTC': 'Bitcoin Network (BTC)',
    'ETH': 'Ethereum Network (ERC-20)',
    'USDT': 'Tron Network (TRC-20)'
  };

  function selectAsset(asset) {
    selectedAsset = asset;
    document.querySelectorAll('.asset-card').forEach(el => el.classList.remove('active'));
    document.getElementById(`btn-asset-${asset.toLowerCase()}`).classList.add('active');
    
    // Update network input and calculation label
    document.getElementById('network-input').value = assetNetworks[asset];
    document.getElementById('calc-btc-result').textContent = `0.000000 ${asset}`;
    
    if (!isUidMode) {
      document.getElementById('recipient-label').textContent = `Recipient ${asset} Address`;
      document.getElementById('recipient-input').placeholder = `Enter ${asset} address...`;
    }
    
    handleAmountInput();
  }

  function toggleTransferMode() {
    isUidMode = !isUidMode;
    const labelEl = document.getElementById('recipient-label');
    const inputEl = document.getElementById('recipient-input');
    const toggleBtn = document.getElementById('toggle-mode-btn');

    inputEl.value = '';

    if (isUidMode) {
      labelEl.textContent = 'Recipient NexPay UID';
      inputEl.placeholder = 'Enter 9-digit account UID...';
      inputEl.setAttribute('inputmode', 'numeric');
      inputEl.setAttribute('maxlength', '9');
      toggleBtn.textContent = 'Send via On-Chain';
    } else {
      labelEl.textContent = `Recipient ${selectedAsset} Address`;
      inputEl.placeholder = `Enter ${selectedAsset} address...`;
      inputEl.removeAttribute('inputmode');
      inputEl.removeAttribute('maxlength');
      toggleBtn.textContent = 'Send via UID';
    }
  }

  function handleRecipientInput(input) {
    if (isUidMode) {
      input.value = input.value.replace(/\D/g, '').slice(0, 9);
    }
  }

  function handleAmountInput() {
    const amountVal = parseFloat(document.getElementById('jpy-amount').value) || 0;
    const inputEl = document.getElementById('jpy-amount');
    const errorMsg = document.getElementById('amount-error-msg');
    const calcResult = document.getElementById('calc-btc-result');

    // Force calculated output to remain 0 since balance is 0
    calcResult.textContent = `0.000000 ${selectedAsset}`;

    if (amountVal > 0) {
      inputEl.classList.add('error');
      errorMsg.style.display = 'block';
    } else {
      inputEl.classList.remove('error');
      errorMsg.style.display = 'none';
    }
  }

  function handlePreview() {
    const recipient = document.getElementById('recipient-input').value.trim();
    const amountVal = parseFloat(document.getElementById('jpy-amount').value) || 0;

    if (!recipient) {
      alert(isUidMode ? 'Please enter a recipient UID.' : `Please enter a valid recipient ${selectedAsset} address.`);
      return;
    }

    if (amountVal <= 0 || amountVal > 0) {
      alert('Transfer amount exceeds available portfolio balance ($0.00).');
      return;
    }
  }
</script>
</body>
</html>
